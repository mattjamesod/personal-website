---
layout: with_navigation
---

<header class="book-header">
	<h1 class="print-title small">{{ page.title }}</h1>
	<div class="book-header-meta">
		<span>By {{ page.author }}</span>
		<span>Finished <time datetime="{{ page.read }}">{{ page.read | date_to_long_string: "ordinal" }}</time></span>
		<span>{% include book-star-rating.html rating=page.rating %}</span>
	</div>
</header>
<article class="prose">
	{{ content }}
</article>
